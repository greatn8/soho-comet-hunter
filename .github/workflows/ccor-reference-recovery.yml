name: CCOR endorsed reference recovery audit
on:
  pull_request:
    paths:
      - 'tools/replay_ccor_reference_cases.py'
      - 'tools/score_ccor_reference_cases.py'
      - 'tools/ccor_reference_reports.json'
      - 'tests/test_ccor_reference_recovery.py'
      - '.github/workflows/ccor-reference-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pillow
      - name: Offline replay and scoring controls
        run: python -m unittest discover -s tests -p 'test_ccor_reference_recovery.py' -v
      - name: Blind replay of adjacent and production multi-baseline modes
        run: python tools/replay_ccor_reference_cases.py --output-dir ccor-reference-recovery
      - name: Score saved blind tracks with registration gate
        if: always()
        run: python tools/score_ccor_reference_cases.py --replay-dir ccor-reference-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ccor-reference-recovery
          path: ccor-reference-recovery/**
          retention-days: 7
          if-no-files-found: error
