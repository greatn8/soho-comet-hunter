name: Realtime review integrity
on:
  push:
    branches: [main, 'fix/realtime-review-integrity-*']
    # The 15-minute dashboard publisher only changes generated observations
    # and media. Running all 220+ regression tests on each data-only commit
    # creates redundant workflow runs and failure email floods.
    # Code/config/test changes still trigger the full test suite.
    paths-ignore:
      - 'docs/data/**'
      - 'docs/media/**'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CCOR test dependencies
        run: python -m pip install numpy pillow
      - name: Check watchdog Bash syntax
        run: bash -n tools/ensure_realtime_running.sh watch_dashboard_publish.sh
      - name: Check Python syntax
        run: python -m py_compile tools/realtime_hunter.py tools/live_review.py tools/pixel_verify.py tools/update_dashboard.py tools/benchmark_known_comets.py tools/recover_known_comet_frames.py tools/ccor_hunter.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
