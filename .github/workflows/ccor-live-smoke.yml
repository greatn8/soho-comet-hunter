name: NOAA CCOR live feed smoke test
on:
  pull_request:
    paths:
      - 'tools/ccor_hunter.py'
      - '.github/workflows/ccor-live-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow numpy
      - name: Verify NOAA CCOR1 and CCOR2 actual JPEG feeds
        run: |
          python - <<'PY'
          import datetime as dt, io
          from PIL import Image
          from tools.ccor_hunter import discover,get
          now=dt.datetime.now(dt.timezone.utc)
          for camera in ("ccor1","ccor2"):
              items,errors=discover(camera,now,lookback_hours=168)
              print(camera,"indexed",len(items),"errors",errors,flush=True)
              if not items:
                  raise RuntimeError(f"{camera}: no recent NOAA CCOR JPEGs found")
              target=items[-1]
              with Image.open(io.BytesIO(get(target["url"],limit=1_500_000))) as image:
                  image.verify()
                  print(camera,"latest",target["name"],"dimensions",image.size,flush=True)
          PY
