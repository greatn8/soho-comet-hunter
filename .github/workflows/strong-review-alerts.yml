name: SOHO strong-review email alerts

on:
  repository_dispatch:
    types: [soho-strong-review, soho-early-review]
  push:
    branches: [main]
    paths:
      - docs/data/realtime.json
      - .github/workflows/strong-review-alerts.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: comet-strong-review-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notification dependencies
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Check notification imports
        run: PYTHONPATH=tools python -c "from check_recent_sungrazer_reports import fetch_and_check"
      - name: Create assigned GitHub issue for new STRONG_REVIEW
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 tools/comet_github_alert.py --issue --age-hours 12
